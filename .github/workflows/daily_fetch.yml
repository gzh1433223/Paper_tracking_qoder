name: Daily Ontology Paper Tracker

on:
  # 每天 UTC 时间 22:00 运行（北京时间次日 6:00）
  schedule:
    - cron: '0 22 * * *'
  
  # 允许手动触发
  workflow_dispatch:

jobs:
  fetch-papers:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Fetch yesterday's papers
      run: python fetch_papers.py
    
    - name: Get yesterday's date
      id: date
      run: echo "date=$(date -d 'yesterday' +%Y-%m-%d)" >> $GITHUB_OUTPUT
    
    - name: Commit and push results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add results/
        if ! git diff --staged --quiet; then
          git commit -m "Add papers for ${{ steps.date.outputs.date }}"
          git push
        else
          echo "No changes to commit"
        fi
    
    - name: Summary
      if: always()
      run: |
        echo "=== 文献追踪完成 ==="
        echo "追踪日期: ${{ steps.date.outputs.date }}（昨天）"
        if [ -f "results/papers_${{ steps.date.outputs.date }}.txt" ]; then
          echo "报告已生成:"
          head -20 "results/papers_${{ steps.date.outputs.date }}.txt"
        fi
